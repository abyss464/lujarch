prefix = "BRD"

# Texts that name the system (BRD-1). In the resource directories of each, every string whose
# text names LineageOS says Lujarch in its place, in every locale; the strings under keep name
# the LineageOS project itself and stay.
[renames.lineage-sdk]
package = "lineageos.platform"
res = ["lineage-sdk/lineage/res/res"]
keep = ["lineage_api_level"]

[renames.lineageparts]
package = "org.lineageos.lineageparts"
res = ["packages/apps/LineageParts/res"]
keep = [
    "anonymous_statistics_summary",
    "anonymous_statistics_title",
    "anonymous_statistics_warning",
    "privacy_settings_category",
]

[renames.setupwizard]
package = "org.lineageos.setupwizard"
res = ["packages/apps/SetupWizard/app/src/main/res"]

[renames.updater]
package = "org.lineageos.updater"
res = ["packages/apps/Updater/app/src/main/res"]

# The mark's images (BRD-3), each made from the one drawing in src/mark: the geometry SystemUI's
# moments draw and the System updates card's mark and colours (into the card's rename overlay),
# at every staging; the boot animation (MOT-1) and recovery's and fastbootd's images by
# `lujarch fetch`, since they need Node and rsvg-convert.
[generated.symbol_data]
script = "src/mark/kotlin.py"
output = "SymbolData.kt"

[generated.updater_mark]
script = "src/mark/vector.py"
output = "updater/res/drawable/lineage_mark_tight.xml"

[generated.updater_colors]
script = "src/mark/colors.py"
output = "updater/res/values/colors.xml"

[generated.bootanimation]
script = "src/mark/bootanimation.py"
output = "bootanimation.zip"
fetch = ["node", "rsvg-convert"]

[generated.recovery]
script = "src/mark/recovery.py"
output = "recovery/res"
fetch = ["node", "rsvg-convert"]
