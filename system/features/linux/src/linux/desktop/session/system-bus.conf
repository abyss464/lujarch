<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
    The desktop's own D-Bus "system" bus (LNX-7): Linux beside Android has no system bus, and the
    desktop's battery (UPower's API, from the android daemon) and GeoClue are on one. The session
    starts it as the desktop's user and points DBUS_SYSTEM_BUS_ADDRESS at it. Only that user
    connects (EXTERNAL authentication by uid), so the policy is open; it has no service
    directories, so nothing is activated on it.
-->
<busconfig>
  <type>session</type>
  <auth>EXTERNAL</auth>
  <listen>unix:path=/tmp/lujarch-android/system_bus</listen>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
