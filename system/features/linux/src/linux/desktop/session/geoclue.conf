# GeoClue on the desktop (LNX-7, Location), installed as /etc/geoclue/conf.d/90-lujarch.conf: the
# phone's location comes from Android through the desktop's android daemon, and nothing else
# locates the phone. The session runs GeoClue as the desktop's user on the desktop's own system bus.

# The daemon is the agent for the desktop's user: GeoClue serves no client of a user without one.
# Programs of the user's own are allowed; Location and Android's location permission and switch
# decide for Linux as a whole.
[agent]
whitelist=lujarch-location

# Exact requests: $GPGGA and $GPRMC sentences on the daemon's socket. GeoClue connects while a
# client needs an exact location, which is when the daemon reads Android's location.
[network-nmea]
enable=true
nmea-socket=/tmp/lujarch-android/nmea.sock

# City-level requests (Firefox's default, the portal's coarse level): GeoClue starts only sources
# no more precise than the request, and the NMEA socket is exact. The daemon writes
# /etc/geolocation (which the desktop's user may write) while a client uses the location, and
# leaves no location in it otherwise.
[static-source]
enable=true

# Sources that would locate the phone some other way: by its IP address through a web service,
# Wi-Fi and cell towers (wpa_supplicant and the modem are Android's), and GeoClue's compass.
[ip]
enable=false

[wifi]
enable=false
submit-data=false

[3g]
enable=false

[cdma]
enable=false

[modem-gps]
enable=false

[compass]
enable=false
