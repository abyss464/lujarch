# Android owns the phone's sound hardware, cameras and Bluetooth: WirePlumber opens none of their
# devices. The desktop's only output is the "android" sink and its only microphone the "android_mic"
# source (pipewire.conf).
#
# The V4L2 monitor is on for the phone's cameras as Linux sees them while they are lent:
# /dev/video40 (back) and /dev/video41 (front), v4l2loopback devices the media daemon feeds from
# Android's cameras. PipeWire then lists them as cameras, for the camera portal and for programs
# that take their camera from PipeWire. No other video node is in Linux's /dev; a device of another
# path is disabled before WirePlumber makes it.
wireplumber.profiles = {
  main = {
    monitor.alsa = disabled
    monitor.alsa-midi = disabled
    monitor.bluez = disabled
    monitor.bluez-midi = disabled
    monitor.v4l2 = optional
    monitor.libcamera = disabled
  }
}

monitor.v4l2.rules = [
  {
    matches = [
      { api.v4l2.path = "!~^/dev/video4[01]$" }
    ]
    actions = {
      update-props = {
        device.disabled = true
        node.disabled = true
      }
    }
  }
  # Names, and a pause when the last program stops watching: the pause stops the device's stream,
  # which tells the media daemon to let Android's camera go.
  {
    matches = [
      { api.v4l2.path = "/dev/video40" }
    ]
    actions = {
      update-props = {
        device.description = "Android back camera"
        node.description = "Android back camera"
        node.nick = "Back camera"
        node.pause-on-idle = true
      }
    }
  }
  {
    matches = [
      { api.v4l2.path = "/dev/video41" }
    ]
    actions = {
      update-props = {
        device.description = "Android front camera"
        node.description = "Android front camera"
        node.nick = "Front camera"
        node.pause-on-idle = true
      }
    }
  }
]
