# The desktop's sound goes to Android (LNX-6). A null sink "android" is the only and default
# output; what it plays goes as raw PCM (S16LE, 48 kHz, stereo) into the FIFO /run/lujarch/sound,
# which the Terminal app plays while the desktop is on screen. Writes that find the FIFO full are
# dropped.
context.objects = [
    { factory = adapter
      args = {
          factory.name     = support.null-audio-sink
          node.name        = "android"
          node.description = "Android"
          media.class      = "Audio/Sink"
          audio.position   = [ FL FR ]
          audio.rate       = 48000
          priority.session = 2000
          priority.driver  = 2000
      }
    }
]

context.modules = [
    { name = libpipewire-module-pipe-tunnel
      args = {
          tunnel.mode    = capture
          pipe.filename  = "/run/lujarch/sound"
          audio.format   = S16LE
          audio.rate     = 48000
          audio.channels = 2
          audio.position = [ FL FR ]
          target.object  = "android"
          stream.props = {
              node.name           = "android.phone"
              node.description    = "Android's speaker"
              stream.capture.sink = true
          }
      }
    }
    # The phone's microphone as Linux's microphone (LNX-7, Microphone): a source that is always there,
    # "Android microphone", reads raw PCM (S16LE, 48 kHz, mono) from a FIFO. The desktop's media daemon
    # (android/media) fills it with Android's microphone while a program records from this source and
    # leaves it empty otherwise (the source then gives silence). The pipe tunnel reads the FIFO without
    # blocking the graph and matches the phone's microphone clock to the graph's with its own DLL.
    { name = libpipewire-module-pipe-tunnel
      args = {
          tunnel.mode      = source
          # The media daemon's MIC_FIFO; PipeWire makes it.
          pipe.filename    = "/tmp/lujarch-microphone"
          audio.format     = S16LE
          audio.rate       = 48000
          audio.channels   = 1
          audio.position   = [ MONO ]
          node.name        = "android_mic"
          node.description = "Android microphone"
          media.class      = "Audio/Source"
          # pipewire-pulse reports a non-virtual source as hardware, so sound settings list it with
          # the microphones instead of among the virtual devices they may hide.
          node.virtual     = false
          stream.props = {
              node.nick        = "Android microphone"
              device.icon-name = "audio-input-microphone"
              priority.session = 2000
          }
      }
      flags = [ nofail ]
    }
]
