# The desktop's sound goes to Android (LNX-6). A null sink "android" is the only and default
# output; what it plays goes as raw PCM (S16LE, 48 kHz, stereo) into the FIFO /run/lujarch/sound,
# which the Terminal app plays while the desktop is on screen. Writes that find the FIFO full are
# dropped.
context.objects = [
    { factory = adapter
      args = {
          factory.name     = support.null-audio-sink
          node.name        = "android"
          node.description = "Android"
          media.class      = "Audio/Sink"
          audio.position   = [ FL FR ]
          audio.rate       = 48000
          priority.session = 2000
          priority.driver  = 2000
      }
    }
]

context.modules = [
    { name = libpipewire-module-pipe-tunnel
      args = {
          tunnel.mode    = capture
          pipe.filename  = "/run/lujarch/sound"
          audio.format   = S16LE
          audio.rate     = 48000
          audio.channels = 2
          audio.position = [ FL FR ]
          target.object  = "android"
          stream.props = {
              node.name           = "android.phone"
              node.description    = "Android's speaker"
              stream.capture.sink = true
          }
      }
    }
]
